[project]
name = "csv2xlsx"
version = "0.1.0"
description = "Convert csv files to xlsx"
authors = [{ name = "George Murga", email = "george.murga+github@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "XlsxWriter>=3.2.0",
    "chardet>=5.2.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
csv2xlsx = "csv2xlsx.csv2xlsx:main"
xlsx2csv = "csv2xlsx.xlsx2csv:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "mypy>=1.12.0",
    "ruff>=0.6.9",
    "pynsist>=2.8",
    "types-openpyxl>=3.1.5.20240918",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
overrides = [{ module = ["xlsxwriter"], ignore_missing_imports = true }]
